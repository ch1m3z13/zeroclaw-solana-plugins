# plugins/token-risk-check/Cargo.toml
[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: check SPL token risk via on-chain data"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "../../core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
