# plugins/token-risk-check/Cargo.toml
[package]
name = "token-risk-check"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: check SPL token risk via on-chain data"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# `component` enables the WIT component export glue. It is ON by default so a
# standalone `cargo build --target wasm32-wasip2` produces the component, but a
# downstream plugin (e.g. solana-pay-request) that only wants the pure
# `risk::check_token_risk` function depends on this crate WITHOUT the feature,
# avoiding duplicate component-export symbols at link time.
[features]
default = ["component"]
component = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "../../core" }

# wit-bindgen is only needed for the wasm component build.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
