# plugins/arc-pay-router/Cargo.toml
[package]
name = "arc-pay-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: multi-chain Solana payment routing via Arc unifiedBalance + quoteRoute"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "../../core" }
token-risk-check = { path = "../token-risk-check", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
