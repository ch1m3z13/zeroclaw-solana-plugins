# plugins/solana-pay-request/Cargo.toml
[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: generate Solana Pay transfer-request URLs with token risk gating"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroclaw-solana-core = { path = "../../core" }
token-risk-check = { path = "../token-risk-check", default-features = false }

# wit-bindgen + waki are only needed for the wasm component build.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
